/* ---------------- Generic multi-document PDF import store ----------------
   Used by both the OpenSolar proposal importer (solar tab) and the survey/
   quote PDF importer (roofing tab). Each store holds one or more parsed
   documents; the person can flip between them, apply either one's figures
   to the estimate, and pick a design/layout page from any of them. */
function createImportStore(){
  return { docs:[], activeDocId:null, appendixItems:[] };
}
let openSolarImport = createImportStore();
let roofingImport = createImportStore();
let openSolarAnnualYieldOverride = null;
let openSolarAnnualSavingsOverride = null;

function getImportStore(importKey){ return importKey==='opensolar' ? openSolarImport : roofingImport; }
function renderImportResults(importKey){ if(importKey==='opensolar') renderOpenSolarResults(); else renderRoofingImportResults(); }
function getAppendixItemsForKind(kind){
  const store = kind==='solar' ? openSolarImport : kind==='roofing' ? roofingImport : null;
  return store ? store.appendixItems : [];
}

function renderEstimating(content, actions){
  const linkedLead = activeLeadId ? state.leads.find(l=>l.id===activeLeadId) : null;
  content.innerHTML = `
    ${linkedLead ? `
      <div class="card" style="padding:12px 20px;margin-bottom:14px;background:var(--green-bg);border-color:#cfe6d8;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="pulse-dot" style="background:var(--green);"></span>
          <span class="small">Linked to lead — <strong>${linkedLead.name}</strong> (${stageLabel(linkedLead.stage)}). Quotes generated here will attach to this lead and move it forward in the pipeline.</span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="unlinkActiveLead()">Unlink</button>
      </div>
    ` : `
      <div class="info-note" style="margin-bottom:14px;">Not linked to a lead — quotes generated here won't update anyone's pipeline stage. Click <strong>Estimate</strong> on a lead card in the Leads tab to link one, or just fill in the details below for a one-off quote.</div>
    `}
    <div class="card" style="padding:16px 20px;margin-bottom:18px;">
      <div class="eyebrow" style="margin-bottom:10px;">Quote details</div>
      <div class="form-grid">
        <div class="field"><label>Customer name</label><input id="q-customer" placeholder="e.g. Priya Ramaswami" value="${quoteMeta.customerName}" oninput="onQuoteMetaChange()"></div>
        <div class="field"><label>Site address</label><input id="q-address" placeholder="e.g. 14 Elm Grove, Reading RG1" value="${quoteMeta.address}" oninput="onQuoteMetaChange()"></div>
        <div class="field field-full"><label>Quote valid for (days)</label><input id="q-validdays" type="number" value="${quoteMeta.validDays}" style="max-width:140px;" oninput="onQuoteMetaChange()"></div>
      </div>
    </div>
    <div class="card" id="quote-basket-card" style="padding:16px 20px;margin-bottom:18px;"></div>
    <div class="tabs">
      <button class="tab-btn ${estimateTab==='roofing'?'active':''}" onclick="switchEstimateTab('roofing')">Roofing</button>
      <button class="tab-btn ${estimateTab==='solar'?'active':''}" onclick="switchEstimateTab('solar')">Solar PV</button>
    </div>
    <div id="estimate-body"></div>
  `;
  renderEstimateBody();
  renderQuoteBasket();
}
function onQuoteMetaChange(){
  quoteMeta.customerName = document.getElementById('q-customer').value;
  quoteMeta.address = document.getElementById('q-address').value;
  quoteMeta.validDays = Number(document.getElementById('q-validdays').value) || 30;
}
function switchEstimateTab(t){ estimateTab = t; renderEstimateBody(); }

/* ---------------- Combined quote basket ----------------
   Lets a customer who wants both roofing and solar get one PDF: build the
   roofing estimate, "Add to Quote", switch tabs, build the solar estimate,
   "Add to Quote" again, then generate one combined document. */
function addToQuoteBasket(){
  if(!lastEstimate || !lastEstimate.lines){ toast('Build an estimate first — there\'s nothing to add yet.'); return; }
  const item = {
    id: 'item-'+Math.random().toString(36).slice(2,9),
    kind: lastEstimate.kind,
    summary: lastEstimate.summary,
    lines: lastEstimate.lines.slice(),
    marginPct: lastEstimate.marginPct,
    marginAmt: lastEstimate.marginAmt,
    netTotal: lastEstimate.netTotal,
    vatAmt: lastEstimate.vatAmt,
    totalIncVat: lastEstimate.total,
    notes: lastEstimate.notes,
    appendix: getAppendixItemsForKind(lastEstimate.kind),
  };
  quoteBasket.push(item);
  toast(typeTag(item.kind)[0]+' estimate added ('+money(item.totalIncVat)+') — '+quoteBasket.length+' item'+(quoteBasket.length>1?'s':'')+' in this quote.');
  renderQuoteBasket();
}
function removeFromQuoteBasket(id){
  quoteBasket = quoteBasket.filter(i=>i.id!==id);
  renderQuoteBasket();
}
function renderQuoteBasket(){
  const el = document.getElementById('quote-basket-card');
  if(!el) return;
  if(quoteBasket.length===0){
    el.innerHTML = `
      <div class="eyebrow" style="margin-bottom:6px;">Quote basket</div>
      <div class="muted small">Empty. Build an estimate below, then click <strong>Add to Quote</strong> — do this for both Roofing and Solar PV if the customer wants both, then generate one combined PDF.</div>
    `;
    return;
  }
  const combinedTotal = quoteBasket.reduce((s,i)=>s+i.totalIncVat,0);
  el.innerHTML = `
    <div class="section-title" style="margin-bottom:8px;"><div class="eyebrow">Quote basket — ${quoteBasket.length} item${quoteBasket.length>1?'s':''}</div><span class="mono" style="font-weight:600;">${money(combinedTotal)} combined</span></div>
    ${quoteBasket.map(i=>`
      <div class="line-item" style="align-items:center;">
        <span class="desc"><span class="tag ${typeTag(i.kind)[1]}" style="margin-right:8px;">${typeTag(i.kind)[0]}</span>${i.summary}</span>
        <span class="amt" style="display:flex;align-items:center;gap:10px;">${money(i.totalIncVat)}
          <button class="btn btn-ghost btn-sm" style="padding:2px 8px;" onclick="removeFromQuoteBasket('${i.id}')">Remove</button>
        </span>
      </div>`).join('')}
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-dark" onclick="generateCombinedQuotePdf()">Generate Combined Quote PDF (${quoteBasket.length} item${quoteBasket.length>1?'s':''})</button><button class="btn btn-ghost" onclick="goTo('quotePreview')">Preview first</button></div>
  `;
}

/* ---------------- Quote preview (read-only, mirrors what will be generated) ---------------- */
function buildQuoteDraft(){
  if(quoteBasket.length>0){
    const kinds = [...new Set(quoteBasket.map(i=>i.kind))];
    const kind = kinds.length>1 ? 'both' : kinds[0];
    const combinedLines = [];
    quoteBasket.forEach(item=>{
      combinedLines.push(['— '+typeTag(item.kind)[0].toUpperCase()+' — '+item.summary, '']);
      item.lines.forEach(l=>combinedLines.push(l));
    });
    return {
      isCombined: true,
      itemCount: quoteBasket.length,
      draft: {
        kind,
        customerName: quoteMeta.customerName || 'Prospective Customer',
        address: quoteMeta.address || '',
        validDays: quoteMeta.validDays,
        summary: quoteBasket.map(i=>typeTag(i.kind)[0]+': '+i.summary).join(' | '),
        lines: combinedLines,
        marginPct: null,
        marginAmt: null,
        netTotal: quoteBasket.reduce((s,i)=>s+i.netTotal,0),
        vatAmt: quoteBasket.reduce((s,i)=>s+i.vatAmt,0),
        totalIncVat: quoteBasket.reduce((s,i)=>s+i.totalIncVat,0),
        notes: quoteBasket.map(i=>typeTag(i.kind)[0]+': '+i.notes).join('  '),
        appendix: quoteBasket.flatMap(i=>i.appendix||[]),
      },
    };
  }
  if(lastEstimate && lastEstimate.lines){
    return {
      isCombined: false,
      itemCount: 1,
      draft: {
        kind: lastEstimate.kind,
        customerName: quoteMeta.customerName || 'Prospective Customer',
        address: quoteMeta.address || '',
        validDays: quoteMeta.validDays,
        summary: lastEstimate.summary,
        lines: lastEstimate.lines,
        marginPct: lastEstimate.marginPct,
        marginAmt: lastEstimate.marginAmt,
        netTotal: lastEstimate.netTotal,
        vatAmt: lastEstimate.vatAmt,
        totalIncVat: lastEstimate.total,
        notes: lastEstimate.notes,
        appendix: getAppendixItemsForKind(lastEstimate.kind),
      },
    };
  }
  return null;
}

let previewState = null; // populated fresh from buildQuoteDraft() each time the tab loads; edits mutate this directly

function renderQuotePreview(content, actions){
  actions.innerHTML = '';
  const built = buildQuoteDraft();
  if(!built){
    previewState = null;
    content.innerHTML = `
      <div class="empty-state">
        <div class="display">Nothing to preview yet</div>
        <div class="muted" style="margin-top:6px;">Build a roofing or solar estimate first — either generate its PDF directly, or click <strong>+ Add to Quote</strong> to stage one or both trades — and the preview will appear here before anything is created.</div>
        <div style="margin-top:14px;"><button class="btn btn-primary" onclick="goTo('estimating')">Go to Estimating</button></div>
      </div>`;
    return;
  }
  const d = built.draft;
  previewState = {
    isCombined: built.isCombined,
    kind: d.kind,
    customerName: d.customerName,
    address: d.address,
    validDays: d.validDays,
    summary: d.summary,
    notes: d.notes,
    appendix: d.appendix,
    marginPct: d.marginPct,
    vatRate: d.netTotal>0 ? d.vatAmt/d.netTotal : 0,
    lines: d.lines.map(l=>[l[0], l[1]]),
  };
  renderPreviewBody();
}
function computePreviewTotals(){

  const coreSubtotal = mainLines.reduce((s,l)=>s+(l[1]===''?0:(Number(l[1])||0)),0);

  return computeSplitTotals(coreSubtotal, upgradesSubtotal, previewState.marginPct, previewState.vatRate);
}

// Mirrors how the PDF finds each trade's summary text — needed because a
// combined preview's lines carry "— ROOFING — ..." / "— SOLAR — ..." header
// rows rather than one clean summary string per trade.
function extractTradeSummariesFromLines(lines, fallbackKind, fallbackSummary){
  const headers = lines.filter(l=>l[1]==='');
  if(headers.length===0){
    return {
      roofingSummary: fallbackKind==='roofing' ? fallbackSummary : null,
      solarSummary: fallbackKind==='solar' ? fallbackSummary : null,
    };
  }
  let roofingSummary=null, solarSummary=null;
  headers.forEach(h=>{
    const title = h[0].replace(/^—\s*/,'').trim();
    const parts = title.split('—');
    const summaryPart = parts.length>1 ? parts.slice(1).join('—').trim() : '';
    if(title.toUpperCase().includes('ROOFING')) roofingSummary = summaryPart;
    else if(title.toUpperCase().includes('SOLAR')) solarSummary = summaryPart;
  });
  return { roofingSummary, solarSummary };
}

/* ---------------- Shared multi-file PDF import engine ---------------- */
async function parsePdfFile(file){
  if(!window.pdfjsLib) throw new Error("PDF reader library hasn't finished loading — wait a moment and try again.");
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
  const buffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  let fullText = '';
  const pages = [];
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const textContent = await page.getTextContent();
    fullText += '\n' + textContent.items.map(it=>it.str).join(' ');
    const viewport = page.getViewport({ scale: 0.4 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    pages.push({ pageNumber:i, thumbDataUrl: canvas.toDataURL('image/jpeg', 0.7), pageRef: page });
  }
  return { fileName: file.name, fullText, pages };
}
async function renderPdfPageHiRes(pageRef, scale){
  const viewport = pageRef.getViewport({ scale: scale||2.2 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  await pageRef.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  return { dataUrl: canvas.toDataURL('image/jpeg', 0.88), width: canvas.width, height: canvas.height };
}

async function processImportFiles(files, importKey){

  if(pdfFiles.length===0){ toast('Please upload one or more PDF files.'); return; }
  const store = getImportStore(importKey);

  for(const file of pdfFiles){
    statusEl.innerHTML = `<div class="info-note"><span class="spinner" style="border-top-color:#3E5A9E;border-color:rgba(62,90,158,0.25);"></span>Reading ${file.name}…</div>`;

      const fields = importKey==='opensolar' ? extractOpenSolarFields(parsed.fullText) : extractRoofingFields(parsed.fullText);
      const doc = { id:'doc-'+Math.random().toString(36).slice(2,9), fileName: parsed.fileName, pages: parsed.pages, fields };
      store.docs.push(doc);
      store.activeDocId = doc.id;
      toast('Parsed '+file.name+' ('+parsed.pages.length+' page'+(parsed.pages.length===1?'':'s')+').');

  if(!statusEl.innerHTML.includes('red-bg')) statusEl.innerHTML = '';

/* ---- Pro-Fit branding stamp: every page pulled from a third-party PDF
   gets a small branded tag burned into the image itself before it's
   attached to a quote, so the file carries Pro-Fit identity even if it's
   later saved or shared out of the PDF context. ---- */
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function brandCapturedPageImage(sourceDataUrl, width, height){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      const tagW = Math.min(width*0.38, 320);
      const tagH = tagW*0.30;
      const pad = width*0.018;
      const x = width - tagW - pad;
      const y = height - tagH - pad;

      ctx.fillStyle = 'rgba(11,79,84,0.93)';
      roundRectPath(ctx, x, y, tagW, tagH, tagH*0.2);
      ctx.fill();

      const dotR = tagH*0.26;
      const dotCx = x + tagH*0.55, dotCy = y + tagH*0.5;
      ctx.fillStyle = '#1C9289';
      ctx.beginPath(); ctx.arc(dotCx, dotCy, dotR, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#1C9289'; ctx.lineWidth = tagH*0.045; ctx.lineCap = 'round';
      [[-1,-1.5],[0,-1.9],[1,-1.5]].forEach(([dx,dy])=>{
        ctx.beginPath();
        ctx.moveTo(dotCx+dx*dotR*0.9, dotCy+dy*dotR*0.55);
        ctx.lineTo(dotCx+dx*dotR*1.5, dotCy+dy*dotR*0.95);
        ctx.stroke();
      });

      ctx.fillStyle = '#FFFFFF';
      ctx.textBaseline = 'alphabetic';
      ctx.font = 'bold '+Math.round(tagH*0.24)+'px Arial, sans-serif';
      ctx.fillText('Pro-Fit Green Energy', x+tagH*1.15, y+tagH*0.44);
      ctx.fillStyle = '#1C9289';
      ctx.font = Math.round(tagH*0.19)+'px Arial, sans-serif';
      ctx.fillText('pf-energy.com', x+tagH*1.15, y+tagH*0.72);

      resolve(canvas.toDataURL('image/jpeg', 0.9));
    };
    img.onerror = () => reject(new Error('Could not load the captured page image for branding.'));
    img.src = sourceDataUrl;
  });
}

function isInAppendix(store, docId, pageNumber){

async function toggleAppendixPage(importKey, docId, pageNumber){
  const store = getImportStore(importKey);
  const existingIdx = store.appendixItems.findIndex(a=>a.docId===docId && a.pageNumber===pageNumber);
  if(existingIdx>-1){
    store.appendixItems.splice(existingIdx,1);
    renderImportResults(importKey);
    return;
  }
  const doc = store.docs.find(d=>d.id===docId);
  const p = doc && doc.pages.find(pg=>pg.pageNumber===pageNumber);
  if(!p) return;
  toast('Rendering and branding page '+pageNumber+' for the quote…');
  try{
    const hiRes = await renderPdfPageHiRes(p.pageRef, 2.2);
    const brandedDataUrl = await brandCapturedPageImage(hiRes.dataUrl, hiRes.width, hiRes.height);
    store.appendixItems.push({
      dataUrl: brandedDataUrl, width: hiRes.width, height: hiRes.height,
      pageNumber, docId, sourceFileName: doc.fileName,
    });
    renderImportResults(importKey);
    toast('Added to appendix — page '+pageNumber+' ('+doc.fileName+'), Pro-Fit branded.');
  } catch(err){
    console.error(err);
    toast('Could not render that page — try another.');
  }
}

/* ---------------- OpenSolar proposal — field extraction & UI ---------------- */
function trimToClause(str){
  if(!str) return str;
  const cut = str.search(/\.\s|\.$/);
  return (cut>2 ? str.slice(0,cut) : str).trim();
}

// Pulls an estimated annual energy-bill saving (in £) out of proposal text.
// Handles the qualifier ("annual"/"year 1"/"first year") appearing either
// before or after the word "saving(s)", and explicitly excludes monthly
// figures and multi-year/lifetime totals (e.g. "25 year savings: £20,450")
// so those don't get misread as an annual figure.
function extractAnnualSavingsGbp(norm){
  const yearWord = '(?:annual|estimated annual|year\\s*(?:1|one)|first\\s*year)';
  const strictPatterns = [
    new RegExp(yearWord+'[^\\d£]{0,30}sav(?:e|ing)s?[^\\d£]{0,12}£\\s*([\\d,]+)', 'i'),
    new RegExp('sav(?:e|ing)s?[^\\d£]{0,20}\\(?'+yearWord+'\\)?[^\\d£]{0,15}£\\s*([\\d,]+)', 'i'),
    new RegExp('sav(?:e|ing)s?[^\\d£]{0,15}£\\s*([\\d,]+)\\s*(?:\\/|per)?\\s*(?:yr|year)', 'i'),
    new RegExp('£\\s*([\\d,]+)\\s*(?:\\/|per)?\\s*(?:yr|year)?\\s*(?:in\\s*)?sav(?:e|ing)s?', 'i'),
  ];
  for(const re of strictPatterns){
    const m = norm.match(re);
    if(m) return parseInt(m[1].replace(/,/g,''),10);
  }
  // Fallback: scan every £ amount in document order and accept the first
  // one whose surrounding context mentions savings without a monthly or
  // multi-year/lifetime qualifier nearby (a wide-enough window to avoid
  // truncating keywords like "Monthly" mid-word, but tight enough to
  // avoid picking up an unrelated cost figure from elsewhere in the text).
  const amountRe = /£\s*([\d,]+)/g;
  let match;
  while((match = amountRe.exec(norm)) !== null){
    const amount = parseInt(match[1].replace(/,/g,''),10);
    if(!amount) continue;
    const start = Math.max(0, match.index-40);
    const end = Math.min(norm.length, match.index+match[0].length+40);
    const context = norm.slice(start,end).toLowerCase();
    if(!/sav(e|ing)/.test(context)) continue;
    if(/month/.test(context)) continue;
    if(/lifetime|\d{2}[\s-]*year/.test(context)) continue;
    return amount;
  }
  return null;
}
// Shared summary/notes parsers — used by both the PDF generator and the
// Proposal Preview tab, so the two always agree on what a quote's summary
// string and notes actually mean.
function parseRoofingSummary(summary){
  const flatMatch = summary && summary.match(/([\d.]+)\s*m²\s*flat\s*·\s*(.+)/i);
  const pitchedMatch = summary && summary.match(/([\d.]+)\s*m²\s*pitched\s*·\s*(.+)/i);
  if(flatMatch) return { type:'flat', area:flatMatch[1], material:flatMatch[2].trim() };
  if(pitchedMatch) return { type:'pitched', area:pitchedMatch[1], material:pitchedMatch[2].trim() };
  return null;
}
function parseSolarSummary(summary){
  const m = summary && summary.match(/([\d.]+)\s*kWp\s*·\s*(\d+)\s*panels\s*·\s*([^·]+?)(?:\s*·\s*([\d.]+)\s*kWh\s*storage)?$/i);
  if(!m) return null;
  return { kw:m[1], panels:m[2], mounting:m[3].trim(), batteryKwh:m[4]||null };
}
function extractAnnualGenFromNotes(notes){
  const m = notes && notes.match(/annual generation:\s*([\d,]+)\s*kwh/i);
  return m ? parseInt(m[1].replace(/,/g,''),10) : null;
}
function extractAnnualSavingsFromNotes(notes){
  const m = notes && notes.match(/bill savings from self-consumption:\s*£\s*([\d,]+)/i);
  return m ? parseInt(m[1].replace(/,/g,''),10) : null;
}
function extractOpenSolarFields(text){
  const norm = text.replace(/\s+/g,' ');
  let m;
  const systemSizeKw = (m = norm.match(/system\s*size[^0-9]{0,20}([\d]+\.?\d*)\s*kw/i) || norm.match(/([\d]+\.?\d*)\s*kw\s*(?:dc)?\s*system/i)) ? parseFloat(m[1]) : null;
  const panelMatch = norm.match(/(\d{1,3})\s*(?:x|×)\s*(\d{3,4})\s*w/i);
  const panelCount = panelMatch ? parseInt(panelMatch[1],10) : null;
  const panelWatt = panelMatch ? parseInt(panelMatch[2],10) : null;
  const annualGenerationKwh = (m = norm.match(/(?:annual|estimated annual|year\s*1)[^\d]{0,25}(?:production|generation|output)[^\d]{0,10}([\d,]+)\s*kwh/i)
    || norm.match(/([\d,]{4,7})\s*kwh\s*(?:\/|per)?\s*(?:yr|year)/i)) ? parseInt(m[1].replace(/,/g,''),10) : null;
  const annualSavingsGbp = extractAnnualSavingsGbp(norm);
  const customerNameGuess = (m = norm.match(/prepared\s*for[:\s]+([A-Za-z][^,\n]{2,60})/i)) ? trimToClause(m[1]) : null;
  const addressGuess = (m = norm.match(/(?:site|installation|property)\s*address[:\s]+([^\n]{5,90})/i)) ? trimToClause(m[1]) : null;

  let mountingGuess = null;
  for(const [re,key] of [[/flat\s*roof|ballasted/i,'flatBallasted'],[/in-?roof|integrated\s*(?:mount|panel)/i,'inRoof'],[/on-?roof|rail\s*mount/i,'onRoof']]){
    if(re.test(norm)){ mountingGuess = key; break; }
  }
  let inverterGuess = null;
  for(const [re,key] of [[/hybrid\s*inverter/i,'hybrid'],[/micro-?inverter/i,'micro'],[/power\s*optimi[sz]er/i,'optimisers'],[/string\s*inverter/i,'string']]){
    if(re.test(norm)){ inverterGuess = key; break; }
  }
  const batteryMatch = norm.match(/([\d]+\.?\d*)\s*kwh\s*batter/i) || norm.match(/batter[a-z]*[^0-9]{0,15}([\d]+\.?\d*)\s*kwh/i);
  const batteryKwhGuess = batteryMatch ? parseFloat(batteryMatch[1]) : null;
  const evChargerGuess = /ev\s*charger|electric\s*vehicle\s*charg/i.test(norm);
  const installTypeGuess = /commercial|business\s*premises/i.test(norm) ? 'commercial' : (/residential|domestic|homeowner/i.test(norm) ? 'residential' : null);

  return { systemSizeKw, panelCount, panelWatt, annualGenerationKwh, annualSavingsGbp, customerNameGuess, addressGuess,
    mountingGuess, inverterGuess, batteryKwhGuess, evChargerGuess, installTypeGuess };
}

function applyOpenSolarToEstimate(auto){
  const systemSize = Number(document.getElementById('os-systemsize').value)||null;
  const panelCount = Number(document.getElementById('os-panelcount').value)||null;
  const panelWatt = Number(document.getElementById('os-panelwatt').value)||null;
  const annualGen = Number(document.getElementById('os-annualgen').value)||null;
  const annualSavings = Number(document.getElementById('os-annualsavings').value)||null;
  const customerName = document.getElementById('os-customer').value.trim();
  const address = document.getElementById('os-address').value.trim();
  const mountingKey = document.getElementById('os-mounting').value;
  const inverterKey = document.getElementById('os-inverter-guess').value;
  const batteryKwh = Number(document.getElementById('os-batterykwh').value)||0;
  const evCharger = document.getElementById('os-ev').checked;
  const instype = document.getElementById('os-instype-guess').value;

  if(panelCount && document.getElementById('sl-panels')) document.getElementById('sl-panels').value = panelCount;
  if(panelWatt && document.getElementById('sl-watt')) document.getElementById('sl-watt').value = panelWatt;
  if(!panelCount && !panelWatt && systemSize && document.getElementById('sl-panels') && document.getElementById('sl-watt')){
    const assumedWatt = 430;
    document.getElementById('sl-watt').value = assumedWatt;
    document.getElementById('sl-panels').value = Math.round((systemSize*1000)/assumedWatt);
  }
  if(mountingKey && document.getElementById('sl-mount')) document.getElementById('sl-mount').value = mountingKey;
  if(inverterKey && document.getElementById('sl-inverter')) document.getElementById('sl-inverter').value = inverterKey;
  if(evCharger && document.getElementById('sl-ev')) document.getElementById('sl-ev').checked = true;
  if(instype && document.getElementById('sl-instype')) document.getElementById('sl-instype').value = instype;
  if(batteryKwh>0 && document.getElementById('sl-battery-product') && document.getElementById('sl-battery-qty')){
    const battOptions = state.materials.batteries || [];
    if(battOptions.length){
      let best = battOptions[0], bestDiff = Math.abs((best.kwh||0)-batteryKwh);
      battOptions.forEach(b=>{ const diff=Math.abs((b.kwh||0)-batteryKwh); if(diff<bestDiff){ best=b; bestDiff=diff; } });
      document.getElementById('sl-battery-product').value = best.key;
      document.getElementById('sl-battery-qty').value = Math.max(1, Math.round(batteryKwh/(best.kwh||batteryKwh)));
      const toggle = document.getElementById('sl-battery-toggle');
      const fields = document.getElementById('sl-battery-fields');
      if(toggle){ toggle.checked = true; }
      if(fields){ fields.style.display = 'block'; }
    }
  }
  openSolarAnnualYieldOverride = annualGen || null;
  openSolarAnnualSavingsOverride = annualSavings || null;

  if(customerName && !quoteMeta.customerName){ quoteMeta.customerName = customerName; }
  if(address && !quoteMeta.address){ quoteMeta.address = address; }
  const qCustomerEl = document.getElementById('q-customer');
  const qAddressEl = document.getElementById('q-address');
  if(qCustomerEl) qCustomerEl.value = quoteMeta.customerName;
  if(qAddressEl) qAddressEl.value = quoteMeta.address;

  calcSolar();
  toast(auto ? 'Auto-populated the solar estimate from the uploaded PDF — check the breakdown on the right.' : 'Re-applied OpenSolar figures to the estimate.');
}

/* ---------------- Roofing survey/quote PDF — field extraction & UI ---------------- */
function extractRoofingFields(text){
  const norm = text.replace(/\s+/g,' ');
  let m;
  const roofAreaM2 = (m = norm.match(/(?:roof\s*area|total\s*roof\s*area|total\s*area)[^0-9]{0,20}([\d]+\.?\d*)\s*(?:m2|m²|sq\s*m|square\s*met)/i)
    || norm.match(/([\d]+\.?\d*)\s*(?:m2|m²)\s*(?:of\s*)?roof/i)) ? parseFloat(m[1]) : null;
  const pitchDegrees = (m = norm.match(/pitch[^0-9]{0,10}([\d]{1,2})\s*(?:deg|°)/i)) ? parseInt(m[1],10) : null;

  const pitchedKeywords = [
    [/natural\s*slate|welsh\s*slate|spanish\s*slate/i, 'naturalSlate'],
    [/fibre\s*cement\s*slate/i, 'fibreCementSlate'],
    [/clay\s*(plain\s*)?tile/i, 'clayPlain'],
    [/concrete\s*interlocking/i, 'concreteInterlocking'],
    [/concrete\s*plain\s*tile/i, 'concretePlain'],
    [/standing\s*seam/i, 'standingSeamMetal'],
  ];
  const flatKeywords = [
    [/epdm/i, 'epdmRubber'],
    [/grp|fibreglass/i, 'grpFibreglass'],
    [/single[- ]ply|pvc\s*membrane/i, 'singlePlyPVC'],
    [/torch-?on|felt/i, 'felt3Layer'],
  ];
  let coveringGuess = null;
  for(const [re, key] of pitchedKeywords){ if(re.test(norm)){ coveringGuess = key; break; } }
  let membraneGuess = null;
  for(const [re, key] of flatKeywords){ if(re.test(norm)){ membraneGuess = key; break; } }
  const roofTypeGuess = coveringGuess ? 'pitched' : (membraneGuess || /flat\s*roof/i.test(norm) ? 'flat' : null);

  const stripOutMatch = norm.match(/strip\s*out[^0-9]{0,15}(\d)\s*layer/i);
  const stripOutLayersGuess = stripOutMatch ? parseInt(stripOutMatch[1],10) : (/strip\s*out|remov(?:e|al)\s*of\s*existing/i.test(norm) ? 1 : null);
  const scaffoldMatch = norm.match(/scaffold[^0-9]{0,15}(\d+)\s*week/i);
  const scaffoldWeeksGuess = scaffoldMatch ? parseInt(scaffoldMatch[1],10) : null;
  const buildingControlGuess = /building\s*control/i.test(norm);

  const customerNameGuess = (m = norm.match(/prepared\s*for[:\s]+([A-Za-z][^,\n]{2,60})/i)) ? trimToClause(m[1]) : null;
  const addressGuess = (m = norm.match(/(?:site|installation|property)\s*address[:\s]+([^\n]{5,90})/i)) ? trimToClause(m[1]) : null;
  return { roofAreaM2, pitchDegrees, coveringGuess, membraneGuess, roofTypeGuess,
    stripOutLayersGuess, scaffoldWeeksGuess, buildingControlGuess, customerNameGuess, addressGuess };
}

function applyRoofingImportToEstimate(auto){
  const roofType = document.getElementById('rfimp-rooftype').value || 'pitched';
  const area = Number(document.getElementById('rfimp-area').value)||null;
  const pitch = Number(document.getElementById('rfimp-pitch').value)||null;
  const coveringKey = document.getElementById('rfimp-covering').value;
  const membraneKey = document.getElementById('rfimp-membrane').value;
  const customerName = document.getElementById('rfimp-customer').value.trim();
  const address = document.getElementById('rfimp-address').value.trim();
  const stripLayers = document.getElementById('rfimp-striplayers').value;
  const scaffoldWeeks = Number(document.getElementById('rfimp-scaffoldweeks').value)||null;
  const buildingControl = document.getElementById('rfimp-buildingcontrol').checked;

  setRoofStyle(roofType);

  if(roofType==='pitched'){
    if(area && document.getElementById('rf-area-p')) document.getElementById('rf-area-p').value = area;
    if(coveringKey && document.getElementById('rf-covering')) document.getElementById('rf-covering').value = coveringKey;
    if(pitch && document.getElementById('rf-access')){
      document.getElementById('rf-access').value = pitch < 20 ? 'low' : pitch <= 35 ? 'medium' : 'steep';
    }
    if(stripLayers!=='' && document.getElementById('rf-strip-layers')) document.getElementById('rf-strip-layers').value = stripLayers;
  } else {
    if(area && document.getElementById('rf-area-f')) document.getElementById('rf-area-f').value = area;
    if(membraneKey && document.getElementById('rf-membrane')) document.getElementById('rf-membrane').value = membraneKey;
    if(stripLayers!=='' && Number(stripLayers)>0 && document.getElementById('rf-strip-flat')) document.getElementById('rf-strip-flat').checked = true;
  }
  if(scaffoldWeeks!==null && document.getElementById('rf-scaffold-weeks')) document.getElementById('rf-scaffold-weeks').value = scaffoldWeeks;
  if(buildingControl && document.getElementById('rf-buildingcontrol')) document.getElementById('rf-buildingcontrol').checked = true;

  if(customerName && !quoteMeta.customerName){ quoteMeta.customerName = customerName; }
  if(address && !quoteMeta.address){ quoteMeta.address = address; }
  const qCustomerEl = document.getElementById('q-customer');
  const qAddressEl = document.getElementById('q-address');
  if(qCustomerEl) qCustomerEl.value = quoteMeta.customerName;
  if(qAddressEl) qAddressEl.value = quoteMeta.address;

  calcRoof();
  toast(auto ? 'Auto-populated the roofing estimate from the uploaded PDF — check the breakdown on the right.' : 'Re-applied survey/quote figures to the roofing estimate.');
}

function setRoofStyle(style){
  roofStyle = style;
  document.getElementById('pitched-fields').style.display = style==='pitched' ? 'grid' : 'none';
  document.getElementById('flat-fields').style.display = style==='flat' ? 'grid' : 'none';

  document.getElementById('style-btn-flat').classList.toggle('active', style==='flat');
  calcRoof();
}

let roofEditableLines = [];
let roofSummaryText = '';

function calcRoof(){
  const A = ASSUMPTIONS;
  let lines = [];
  let subtotal = 0;

  if(roofStyle==='pitched'){
    const area = Number(document.getElementById('rf-area-p').value)||0;
    const access = document.getElementById('rf-access').value;
    const coveringKey = document.getElementById('rf-covering').value;
    const stripLayers = Number(document.getElementById('rf-strip-layers').value)||0;
    const ridgeLen = Number(document.getElementById('rf-ridge-len').value)||0;
    const hipValleyLen = Number(document.getElementById('rf-hipvalley-len').value)||0;
    const leadLen = Number(document.getElementById('rf-lead-len').value)||0;

    const covering = getMaterial('roofCoverings', coveringKey);
    const waste = A.wasteFactorPitched[access];
    const effArea = area * (1+waste);

    const coveringCost = effArea * covering.price;
    const battens = effArea * getPrice('roofComponents','battens');
    const membraneCost = effArea * getPrice('roofComponents','membrane');
    const ridge = ridgeLen * getPrice('roofComponents','ridge');
    const hipValley = hipValleyLen * getPrice('roofComponents','hipValley');
    const leadwork = leadLen * getPrice('roofComponents','leadwork');
    const stripOut = stripLayers>0 ? area * getPrice('roofComponents','stripOutPitched') * stripLayers : 0;
    const labourKey = access==='low'?'labourPitchedLow':access==='steep'?'labourPitchedSteep':'labourPitchedMedium';
    const labour = area * getPrice('ratesFees', labourKey);

    lines = [
      [covering.label+' ('+effArea.toFixed(1)+' m² incl. waste)', coveringCost],
      ['Battens & counter-battens', battens],
      ['Breather membrane / underlay', membraneCost],
      ['Dry ridge system ('+ridgeLen+'m)', ridge],
    ];
    if(hipValleyLen>0) lines.push(['Hip / valley detail ('+hipValleyLen+'m)', hipValley]);
    if(leadLen>0) lines.push(['Leadwork — flashing ('+leadLen+'m)', leadwork]);
    if(stripOut>0) lines.push(['Strip out existing ('+stripLayers+' layer'+(stripLayers>1?'s':'')+')', stripOut]);
    lines.push(['Labour ('+access+' access)', labour]);

    subtotal = coveringCost+battens+membraneCost+ridge+hipValley+leadwork+stripOut+labour;
    roofSummaryText = area+' m² pitched · '+covering.label;
  } else {
    const area = Number(document.getElementById('rf-area-f').value)||0;
    const membraneKey = document.getElementById('rf-membrane').value;
    const trimLen = Number(document.getElementById('rf-trim-len').value)||0;
    const stripFlat = document.getElementById('rf-strip-flat').checked;
    const decking = document.getElementById('rf-decking').checked;
    const insulation = document.getElementById('rf-insulation').checked;

    const membrane = getMaterial('flatMembranes', membraneKey);
    const effArea = area * (1+A.wasteFactorFlat);

    const membraneCost = effArea * membrane.price;
    const trims = trimLen * getPrice('roofComponents','trim');
    const deckingCost = decking ? area*getPrice('roofComponents','decking') : 0;
    const insulationCost = insulation ? area*getPrice('roofComponents','insulation') : 0;
    const stripOut = stripFlat ? area*getPrice('roofComponents','stripOutFlat') : 0;
    const labour = area * getPrice('ratesFees','labourFlat');

    lines = [
      [membrane.label+' ('+effArea.toFixed(1)+' m² incl. waste)', membraneCost],
      ['Edge trims & drip detail ('+trimLen+'m)', trims],
    ];
    if(deckingCost>0) lines.push(['Deck renewal (ply overlay)', deckingCost]);
    if(insulationCost>0) lines.push(['Insulation upgrade (warm roof)', insulationCost]);
    if(stripOut>0) lines.push(['Strip out existing covering', stripOut]);
    lines.push(['Labour', labour]);

    subtotal = membraneCost+trims+deckingCost+insulationCost+stripOut+labour;
    roofSummaryText = area+' m² flat · '+membrane.label;
  }

  const scaffoldWeeks = Number(document.getElementById('rf-scaffold-weeks').value)||0;
  const skipKey = document.getElementById('rf-skip').value;
  const buildingControl = document.getElementById('rf-buildingcontrol').checked;
  const scaffoldCost = scaffoldWeeks>0 ? getPrice('ratesFees','scaffoldErect') + scaffoldWeeks*getPrice('ratesFees','scaffoldWeek') : 0;
  const skipCost = skipKey==='small' ? getPrice('ratesFees','skipSmall') : skipKey==='large' ? getPrice('ratesFees','skipLarge') : 0;
  const bcCost = buildingControl ? getPrice('ratesFees','buildingControl') : 0;
  if(scaffoldCost>0) lines.push(['Scaffold / access ('+scaffoldWeeks+' wks)', scaffoldCost]);
  if(skipCost>0) lines.push(['Skip hire & waste disposal', skipCost]);
  if(bcCost>0) lines.push(['Building Control notice fee', bcCost]);

  roofEditableLines = lines;
  renderRoofBreakdown();
}

function computeRoofTotals(){
  const A = ASSUMPTIONS;
  const margin = Number(document.getElementById('rf-margin').value)||0;
  const vatOn = document.getElementById('rf-vat').checked;
  const { mainLines, upgradeLines } = splitMainAndUpgradeLines(roofEditableLines);
  const coreSubtotal = mainLines.reduce((s,l)=>s+(Number(l[1])||0),0);
  const upgradesSubtotal = upgradeLines.reduce((s,l)=>s+(Number(l[1])||0),0);
  const vatRate = vatOn ? A.vatRateStandard : 0;
  return Object.assign({ vatOn }, computeSplitTotals(coreSubtotal, upgradesSubtotal, margin, vatRate));
}
// Shared renderer for the "main total, then optional upgrades as an added
// cost, then grand total" layout — used by roofing, solar and the preview.
function splitTotalsHtml(t, vatLabel){
  let html = '';
  html += `<div class="line-item" style="border-top:2px solid var(--ink);padding-top:10px;"><span class="desc">Core scope subtotal</span><span class="amt">${money(t.mainSubtotal)}</span></div>`;
  if(t.hasMargin) html += `<div class="line-item"><span class="desc">Margin (${t.marginPct}%)</span><span class="amt">${money(t.mainMarginAmt)}</span></div>`;
  if(t.mainVat>0) html += `<div class="line-item"><span class="desc">${vatLabel}</span><span class="amt">${money(t.mainVat)}</span></div>`;
  html += `<div class="line-total"><span>Main quote total</span><span class="amt">${money(t.mainTotal)}</span></div>`;

  if(t.hasUpgrades){
    html += `<div class="line-item" style="margin-top:10px;border-top:1px dashed var(--amber);padding-top:10px;color:var(--amber-dark);"><span class="desc">Optional upgrades subtotal</span><span class="amt">${money(t.upgradesSubtotal)}</span></div>`;
    if(t.hasMargin) html += `<div class="line-item" style="color:var(--amber-dark);"><span class="desc">Margin (${t.marginPct}%)</span><span class="amt">${money(t.upgMarginAmt)}</span></div>`;
    if(t.upgVat>0) html += `<div class="line-item" style="color:var(--amber-dark);"><span class="desc">${vatLabel}</span><span class="amt">${money(t.upgVat)}</span></div>`;
    html += `<div class="line-total" style="color:var(--amber-dark);"><span>Optional upgrades total</span><span class="amt">${money(t.upgTotal)}</span></div>`;
    html += `<div class="line-total grand" style="margin-top:8px;"><span>Grand total (main + upgrades)</span><span class="amt">${money(t.grandTotal)}</span></div>`;
  }
  return html;
}
function renderRoofTotalsOnly(){
  const t = computeRoofTotals();
  const vatLabel = t.vatOn ? 'VAT (20%)' : 'VAT (0% — not charged)';
  document.getElementById('roof-totals').innerHTML = splitTotalsHtml(t, vatLabel);

  lastEstimate = {
    kind:'roofing', summary: roofSummaryText, total: t.grandTotal,
    lines: roofEditableLines.slice(), marginPct: t.marginPct, marginAmt: t.blendedMarginAmt, netTotal: t.blendedNetTotal, vatAmt: t.blendedVatAmt,
    notes: 'Roofing works are standard-rated for VAT — there is no reduced VAT relief on re-roofing, unlike qualifying residential solar/battery installs.',
  };
}
function renderRoofBreakdown(){
  const { mainLines, mainIdx, upgradeLines, upgradeIdx } = splitMainAndUpgradeLines(roofEditableLines);
  document.getElementById('roof-lines').innerHTML =
    `<div class="eyebrow" style="margin-bottom:4px;">Core scope</div>` +
    `<div id="roof-lines-main">${editableLineListHtml(mainLines, 'editRoofLineDesc','editRoofLineAmt','deleteRoofLine', mainIdx)}</div>` +
    (upgradeLines.length ? `
      <div class="eyebrow" style="margin:16px 0 4px;color:var(--amber-dark);">Optional upgrades</div>
      <div id="roof-lines-upgrades" style="border:1px dashed var(--amber);border-radius:8px;padding:6px 8px;background:#FBF3E4;">
        ${editableLineListHtml(upgradeLines, 'editRoofLineDesc','editRoofLineAmt','deleteRoofLine', upgradeIdx)}
      </div>` : '') +
    addLineFormHtml('rf-new-desc','rf-new-amt','addRoofLine','rf-new-upgrade') +
    materialsPickerFormHtml('rf','addRoofMaterialLine') +
    `<div id="roof-totals"></div>`;
  refreshMaterialPickerOptions('rf');
  renderRoofTotalsOnly();

  document.getElementById('roof-note').innerHTML =
    `<div class="info-note">Roofing works are standard-rated for VAT — there is no reduced VAT relief on re-roofing, unlike qualifying residential solar/battery installs. Prices pulled from the <a href="#" onclick="goTo('materials');return false;" style="text-decoration:underline;">Materials database</a> — edit them there to update every future quote. Line items below are fully editable — add a custom line or pick straight from the materials database, tweak an amount, or remove one entirely. Optional upgrades are broken out separately but still count toward the total.</div>`;
}
function editRoofLineDesc(i, val){
  roofEditableLines[i][0] = val;
  if(lastEstimate) lastEstimate.lines = roofEditableLines.slice();
}
function editRoofLineAmt(i, val){
  roofEditableLines[i][1] = Number(val)||0;
  renderRoofTotalsOnly();
}
function deleteRoofLine(i){
  roofEditableLines.splice(i,1);
  renderRoofBreakdown();
}
function addRoofLine(){
  const descEl = document.getElementById('rf-new-desc');
  const amtEl = document.getElementById('rf-new-amt');
  const upgradeEl = document.getElementById('rf-new-upgrade');
  const desc = descEl.value.trim();
  const amt = Number(amtEl.value)||0;
  if(!desc){ toast('Enter a description for the custom line first.'); return; }
  const label = (upgradeEl && upgradeEl.checked ? OPTIONAL_UPGRADE_PREFIX : '')+desc;
  roofEditableLines.push([label, amt]);
  renderRoofBreakdown();
}
function addRoofMaterialLine(){
  const line = buildMaterialLineFromPicker('rf');
  if(!line) return;
  roofEditableLines.push(line);
  renderRoofBreakdown();
}

let solarEditableLines = [];
let solarSummaryText = '';
let solarNotesText = '';

function calcSolar(){
  const A = ASSUMPTIONS;
  const panels = Number(document.getElementById('sl-panels').value)||0;
  const watt = Number(document.getElementById('sl-watt').value)||0;
  const tierKey = document.getElementById('sl-tier').value;
  const mountKey = document.getElementById('sl-mount').value;
  const inverterType = document.getElementById('sl-inverter').value;
  const batteryEnabled = document.getElementById('sl-battery-toggle').checked;
  const batteryProductKey = document.getElementById('sl-battery-product').value;
  const batteryQty = batteryEnabled ? (Number(document.getElementById('sl-battery-qty').value)||1) : 0;
  const evCharger = document.getElementById('sl-ev').checked;
  const instype = document.getElementById('sl-instype').value;
  const scaffoldWeeks = Number(document.getElementById('sl-scaffold-weeks').value)||0;

  const kw = (panels*watt)/1000;
  const panelTier = getMaterial('solarPanels', tierKey);
  const panelCost = panels * panelTier.price;
  const mountingItem = getMaterial('mounting', mountKey);
  const mountingCost = panels * mountingItem.price;

  const hasBattery = batteryEnabled && batteryQty>0;
  const batteryProduct = getMaterial('batteries', batteryProductKey);
  const batteryKwhTotal = hasBattery ? batteryProduct.kwh*batteryQty : 0;
  const batteryCost = hasBattery ? batteryProduct.price*batteryQty : 0;

  let inverterCost, inverterLabel;
  if(hasBattery && inverterType!=='hybrid'){
    inverterCost = getPrice('inverters','hybrid');
    inverterLabel = getMaterial('inverters','hybrid').label + ' (auto-selected — required with battery storage)';
  } else if(inverterType==='micro'){
    inverterCost = panels * getPrice('inverters','micro');
    inverterLabel = getMaterial('inverters','micro').label + 's';
  } else if(inverterType==='hybrid'){
    inverterCost = getPrice('inverters','hybrid');
    inverterLabel = getMaterial('inverters','hybrid').label;
  } else {
    inverterCost = getPrice('inverters','optimisers');
    inverterLabel = getMaterial('inverters','optimisers').label;
  }
  if(inverterType==='string' && !hasBattery){
    inverterCost = getPrice('inverters','string');
    inverterLabel = getMaterial('inverters','string').label;
  }

  const evCost = evCharger ? getPrice('ratesFees','evCharger') : 0;
  const scaffoldCost = scaffoldWeeks>0 ? getPrice('ratesFees','scaffoldErect') + scaffoldWeeks*getPrice('ratesFees','scaffoldWeek') : 0;
  const mcsCost = getPrice('ratesFees','mcsCommissioning');
  const needsG99 = kw > A.dnoSmallThresholdKW;
  const dnoCost = needsG99 ? getPrice('ratesFees','dnoG99') : 0;
  const labourCost = kw * getPrice('ratesFees','labourSolarPerKW');

  const lines = [
    ['Panels ('+panels+' × '+watt+'Wp = '+kw.toFixed(2)+' kWp, '+panelTier.label+')', panelCost],
    ['Mounting — '+mountingItem.label, mountingCost],
    [inverterLabel, inverterCost],
  ];
  if(hasBattery) lines.push(['Optional upgrade — '+batteryProduct.label+' × '+batteryQty+' ('+batteryKwhTotal.toFixed(1)+' kWh total)', batteryCost]);
  if(evCost>0) lines.push(['Optional upgrade — EV charger', evCost]);
  if(scaffoldCost>0) lines.push(['Scaffold / access ('+scaffoldWeeks+' wks)', scaffoldCost]);
  lines.push(['MCS certification & commissioning', mcsCost]);
  lines.push(['DNO notification'+(needsG99?' (G99 application)':' (G98 — no fee, <'+A.dnoSmallThresholdKW+'kW)'), dnoCost]);
  lines.push(['Labour & installation', labourCost]);

  document.getElementById('vat-note').innerHTML = (instype==='residential'
    ? `Qualifying residential solar &amp; battery installs benefit from <strong>0% VAT</strong> under current UK relief — no VAT has been added above.`
    : `Commercial installation — standard <strong>20% VAT</strong> applied. Residential installs typically qualify for 0% VAT relief instead.`)
    + ` Equipment prices pulled from the <a href="#" onclick="goTo('materials');return false;" style="text-decoration:underline;">Materials database</a>.`;

  const usingOverride = openSolarAnnualYieldOverride && openSolarAnnualYieldOverride > 0;
  const annualYield = usingOverride ? openSolarAnnualYieldOverride : kw * A.ukAvgYieldPerKWp;
  const exportKwh = annualYield * A.exportShareAssumed;
  const selfConsumedKwh = annualYield - exportKwh;
  const segIncome = exportKwh * (A.segExportRatePence/100);
  const usingSavingsOverride = openSolarAnnualSavingsOverride && openSolarAnnualSavingsOverride > 0;
  const billSavings = usingSavingsOverride ? openSolarAnnualSavingsOverride : selfConsumedKwh * A.retailRatePerKWh;
  const yieldSourceLabel = usingOverride ? 'from imported OpenSolar proposal' : (A.ukAvgYieldPerKWp+' kWh/kWp UK average yield');
  const savingsSourceLabel = usingSavingsOverride ? ' (from imported OpenSolar proposal)' : '';

  document.getElementById('yield-note').innerHTML =
    `Estimated annual generation: <strong>${Math.round(annualYield).toLocaleString('en-GB')} kWh</strong> (${yieldSourceLabel}).<br>` +
    `Indicative bill savings from self-consumption: <strong>${money(billSavings)}</strong>/yr${savingsSourceLabel}. Smart Export Guarantee income on exported units: <strong>${money(segIncome)}</strong>/yr.<br>` +
    `<span class="small">Figures are indicative only — actual output depends on orientation, shading and location.</span>`;

  const vatNote = instype==='residential'
    ? 'Qualifying residential solar & battery installs benefit from 0% VAT under current UK relief — no VAT has been added above.'
    : 'Commercial installation — standard 20% VAT applied. Residential installs typically qualify for 0% VAT relief instead.';
  const yieldNote = 'Estimated annual generation: '+Math.round(annualYield).toLocaleString('en-GB')+' kWh ('+yieldSourceLabel+'). Indicative bill savings from self-consumption: '+money(billSavings)+'/yr'+savingsSourceLabel+'. Smart Export Guarantee income on exported units: '+money(segIncome)+'/yr. Figures are indicative only — actual output depends on orientation, shading and location.';

  solarSummaryText = kw.toFixed(2)+' kWp · '+panels+' panels · '+mountingItem.label+(hasBattery?' · '+batteryKwhTotal.toFixed(1)+' kWh storage':'');
  solarNotesText = vatNote+' '+yieldNote;
  solarEditableLines = lines;
  renderSolarBreakdown();
}

function computeSolarTotals(){
  const A = ASSUMPTIONS;
  const margin = Number(document.getElementById('sl-margin').value)||0;
  const instype = document.getElementById('sl-instype').value;
  const { mainLines, upgradeLines } = splitMainAndUpgradeLines(solarEditableLines);
  const coreSubtotal = mainLines.reduce((s,l)=>s+(Number(l[1])||0),0);
  const upgradesSubtotal = upgradeLines.reduce((s,l)=>s+(Number(l[1])||0),0);
  const vatRate = instype==='commercial' ? A.vatRateCommercialSolar : A.vatRateResidentialSolar;
  return Object.assign({ instype }, computeSplitTotals(coreSubtotal, upgradesSubtotal, margin, vatRate));
}
function renderSolarTotalsOnly(){
  const t = computeSolarTotals();
  const vatLabel = t.instype==='commercial' ? 'VAT (20%)' : 'VAT (0% relief)';
  document.getElementById('solar-totals').innerHTML = splitTotalsHtml(t, vatLabel);

  lastEstimate = {
    kind:'solar', total: t.grandTotal,
    summary: solarSummaryText,
    lines: solarEditableLines.slice(), marginPct: t.marginPct, marginAmt: t.blendedMarginAmt, netTotal: t.blendedNetTotal, vatAmt: t.blendedVatAmt,
    notes: solarNotesText,
  };
}
function renderSolarBreakdown(){
  const { mainLines, mainIdx, upgradeLines, upgradeIdx } = splitMainAndUpgradeLines(solarEditableLines);
  document.getElementById('solar-lines').innerHTML =
    `<div class="eyebrow" style="margin-bottom:4px;">Core scope</div>` +
    `<div id="solar-lines-main">${editableLineListHtml(mainLines, 'editSolarLineDesc','editSolarLineAmt','deleteSolarLine', mainIdx)}</div>` +
    (upgradeLines.length ? `
      <div class="eyebrow" style="margin:16px 0 4px;color:var(--amber-dark);">Optional upgrades</div>
      <div id="solar-lines-upgrades" style="border:1px dashed var(--amber);border-radius:8px;padding:6px 8px;background:#FBF3E4;">
        ${editableLineListHtml(upgradeLines, 'editSolarLineDesc','editSolarLineAmt','deleteSolarLine', upgradeIdx)}
      </div>` : '') +
    addLineFormHtml('sl-new-desc','sl-new-amt','addSolarLine','sl-new-upgrade') +
    materialsPickerFormHtml('sl','addSolarMaterialLine') +
    `<div id="solar-totals"></div>`;
  refreshMaterialPickerOptions('sl');
  renderSolarTotalsOnly();
}
function editSolarLineDesc(i, val){
  solarEditableLines[i][0] = val;
  if(lastEstimate) lastEstimate.lines = solarEditableLines.slice();
}
function editSolarLineAmt(i, val){
  solarEditableLines[i][1] = Number(val)||0;
  renderSolarTotalsOnly();
}
function deleteSolarLine(i){
  solarEditableLines.splice(i,1);
  renderSolarBreakdown();
}
function addSolarLine(){
  const descEl = document.getElementById('sl-new-desc');
  const amtEl = document.getElementById('sl-new-amt');
  const upgradeEl = document.getElementById('sl-new-upgrade');
  const desc = descEl.value.trim();
  const amt = Number(amtEl.value)||0;
  if(!desc){ toast('Enter a description for the custom line first.'); return; }
  const label = (upgradeEl && upgradeEl.checked ? OPTIONAL_UPGRADE_PREFIX : '')+desc;
  solarEditableLines.push([label, amt]);
  renderSolarBreakdown();
}
function addSolarMaterialLine(){
  const line = buildMaterialLineFromPicker('sl');
  if(!line) return;
  solarEditableLines.push(line);
  renderSolarBreakdown();
}
function toggleBatteryUpgrade(){
  const on = document.getElementById('sl-battery-toggle').checked;
  document.getElementById('sl-battery-fields').style.display = on ? 'block' : 'none';
  calcSolar();
}

function saveEstimate(kind){
  if(!lastEstimate) return;
  toast('Estimate saved: '+money(lastEstimate.total)+' ('+lastEstimate.summary+'). Attach it to a lead from the Leads board.');
  log('Estimate Saved', 'New '+kind+' estimate saved at '+money(lastEstimate.total)+' — '+lastEstimate.summary+'.', 'copper');
  if(state.currentView==='dashboard') render();
}
function sendQuote(kind){
  if(!lastEstimate) return;
  fireAutomation('Estimate Sent', kind[0].toUpperCase()+kind.slice(1)+' quote ('+money(lastEstimate.total)+') emailed to customer. 3-day follow-up scheduled.', 'copper', 400);
}
function quickEstimate(leadId){
  const lead = state.leads.find(l=>l.id===leadId);
  if(lead){
    activeLeadId = lead.id;
    quoteMeta.customerName = lead.name;
  }
  goTo('estimating');
  toast(lead ? ('Linked to lead: '+lead.name+'. Fill in scope on the left.') : 'Building an estimate. Fill in scope on the left.');
}
function unlinkActiveLead(){
  activeLeadId = null;
  toast('Estimate unlinked from lead — quotes generated now won\'t update any lead.');
  render();
}

/* ================= JOBS ================= */
function renderJobs(content, actions){
  actions.innerHTML = '';
  const statuses = ['scheduled','inProgress','completed','invoiced'];
  content.innerHTML = `
    <div class="card" style="padding:4px;">
      <table>
        <thead><tr><th>Customer</th><th>Type</th><th>Team</th><th>Materials</th><th>Status</th><th>Value</th><th></th></tr></thead>
        <tbody>
          ${state.jobs.map(j=>`
            <tr>
              <td>${j.customer}</td>
              <td><span class="tag ${typeTag(j.type)[1]}">${typeTag(j.type)[0]}</span></td>
              <td><span class="crew-avatar">${j.crew.split(' ')[0][0]}${(j.crew.split(' ')[1]||'')[0]||''}</span>${j.crew}</td>
              <td class="materials-check"><input type="checkbox" ${j.materialsOrdered?'checked':''} onchange="toggleMaterials('${j.id}')"> Ordered</td>
              <td><div class="pill-select"><select onchange="setJobStatus('${j.id}', this.value)">
                ${statuses.map(s=>`<option value="${s}" ${j.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}
              </select></div></td>
              <td class="mono">${money(j.value)}</td>
              <td><button class="btn btn-ghost btn-sm" onclick="reassignCrew('${j.id}')">Reassign</button></td>
            </tr>`).join('') || '<tr><td colspan="7"><div class="empty-state">No jobs yet — win a lead to create one.</div></td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}
async function toggleMaterials(id){
  const job = state.jobs.find(j=>j.id===id);
  const previous = job.materialsOrdered;
  job.materialsOrdered = !job.materialsOrdered; // optimistic
  render();
  try{
    const res = await apiPatch(`/api/jobs/${id}`, { materialsOrdered: job.materialsOrdered });
    Object.assign(job, res.job);
  } catch(err){
    job.materialsOrdered = previous;
    toast("Couldn't update job — "+err.message);
    render();
  }
}
async function reassignCrew(id){
  const job = state.jobs.find(j=>j.id===id);
  const idx = TEAMS.indexOf(job.crew);
  const newCrew = TEAMS[(idx+1)%TEAMS.length];
  try{
    const res = await apiPatch(`/api/jobs/${id}`, { crew: newCrew });
    Object.assign(job, res.job);
    if(res.activity) state.activity.unshift(res.activity);
    render();
  } catch(err){
    toast("Couldn't reassign crew — "+err.message);
  }
}
async function setJobStatus(id, newStatus){
  const job = state.jobs.find(j=>j.id===id);
  try{
    const res = await apiPatch(`/api/jobs/${id}`, { status: newStatus });
    Object.assign(job, res.job);
    if(res.invoice) state.invoices.unshift(res.invoice);
    if(res.activity){
      state.activity.unshift(res.activity);
      if(res.invoice) toast('Automation fired: '+res.activity.text);
    }
    render();
  } catch(err){
    toast("Couldn't update job status — "+err.message);
  }
}

/* ================= AUTOMATIONS ================= */
function renderAutomations(content, actions){
  content.innerHTML = `
    <div class="section-title"><h2>Active rules</h2><span class="muted small">${state.automations.filter(a=>a.enabled).length} of ${state.automations.length} enabled</span></div>
    ${state.automations.map(r=>`
      <div class="rule-card">
        <label class="switch"><input type="checkbox" ${r.enabled?'checked':''} onchange="toggleAutomation('${r.id}')"><span class="slider"></span></label>
        <div class="rule-flow"><span class="rule-chip">${r.trigger}</span><span class="rule-arrow">&rarr;</span><span>${r.action}</span></div>
      </div>`).join('')}
    <div class="section-title" style="margin-top:24px;"><h2>Automation run log</h2></div>
    <div id="activity-feed">
      ${state.activity.slice(0,20).map(a=>`
        <div class="ticket tone-${a.tone}"><div class="perf-edge"></div>
          <div class="ticket-top"><span class="ticket-tag">${a.tag}</span><span class="ticket-time">${timeAgo(a.ts)}</span></div>
          <div class="ticket-text">${a.text}</div></div>`).join('') || '<div class="empty-state">No automation activity yet.</div>'}
    </div>

}
async function toggleAutomation(id){
  const rule = state.automations.find(r=>r.id===id);
  const previous = rule.enabled;
  rule.enabled = !rule.enabled; // optimistic
  render();
  try{
    const updated = await apiPatch(`/api/automations/${id}`, { enabled: rule.enabled });
    Object.assign(rule, updated);
    toast('Rule '+(rule.enabled?'enabled':'disabled')+': '+rule.trigger);
  } catch(err){
    rule.enabled = previous;
    toast("Couldn't update rule — "+err.message);
    render();
  }
}

/* ================= INVOICING ================= */
function renderInvoicing(content, actions){
  content.innerHTML = `
    <div class="card" style="padding:4px;">
      <table>
        <thead><tr><th>Invoice</th><th>Customer</th><th>Amount</th><th>Due</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${state.invoices.map(inv=>{
            const dueLabel = inv.dueInDays<0 ? Math.abs(inv.dueInDays)+' days overdue' : 'due in '+inv.dueInDays+' days';

            <tr>
              <td class="mono">${inv.id}</td><td>${inv.customer}</td><td class="mono">${money(inv.amount)}</td>

              <td><span class="status-pill ${statusPillClass(inv.status)}">${statusLabel(inv.status)}</span></td>
              <td>${inv.status!=='paid' ? '<button class="btn btn-primary btn-sm" onclick="markPaid(\''+inv.id+'\')">Mark Paid</button>' : ''}</td>
            </tr>`;
          }).join('') || '<tr><td colspan="6"><div class="empty-state">No invoices yet.</div></td></tr>'}
        </tbody>
      </table>

}
async function markPaid(id){
  const inv = state.invoices.find(i=>i.id===id);
  try{
    const res = await apiPatch(`/api/invoices/${id}`, { status:'paid' });
    Object.assign(inv, res.invoice);
    if(res.activity) state.activity.unshift(res.activity);
    render();
  } catch(err){
    toast("Couldn't mark invoice paid — "+err.message);
  }
}

/* ================= REPORTS ================= */

  content.innerHTML = `
    <div class="two-col">
      <div class="card chart-card"><h3 style="font-size:16px;margin-bottom:10px;">Revenue trend (last 6 months)</h3><div class="chart-box"><canvas id="revChart"></canvas></div></div>

  `;
  drawChart('revChart','line',['Feb','Mar','Apr','May','Jun','Jul'],[{ label:'Revenue', data:[38000,44000,52000,49000,61000,72000], borderColor:'#E8A23D', backgroundColor:'rgba(232,162,61,0.15)', fill:true, tension:0.3 }]);
  const roofingCount = state.jobs.filter(j=>j.type==='roofing').length || 1;
  const solarCount = state.jobs.filter(j=>j.type==='solar').length || 1;
  drawChart('mixChart','doughnut',['Roofing','Solar'],[{ data:[roofingCount,solarCount], backgroundColor:['#B5623A','#E8A23D'] }]);
  const stages = ['new','contacted','estimateScheduled','estimateSent','won'];
  drawChart('stageChart','bar',stages.map(stageLabel),[{ label:'Value', data: stages.map(s=>state.leads.filter(l=>l.stage===s).reduce((sum,l)=>sum+l.value,0)), backgroundColor:'#B5623A' }],true);
  const jobStatuses = ['scheduled','inProgress','completed','invoiced'];
  drawChart('jobChart','doughnut', jobStatuses.map(statusLabel), [{ data: jobStatuses.map(s=>state.jobs.filter(j=>j.status===s).length), backgroundColor:['#3E5A9E','#E8A23D','#4C9A6A','#6A4E9E'] }]);
}

const chartRegistry = {};
function drawChart(canvasId, type, labels, datasets, hideLegend){
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  if(chartRegistry[canvasId]) chartRegistry[canvasId].destroy();
  chartRegistry[canvasId] = new Chart(ctx, {
    type, data: { labels, datasets },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display: !hideLegend && type!=='bar', labels:{ font:{ family:'Inter' } } } },
      scales: type==='doughnut' ? {} : {
        x:{ ticks:{ font:{ family:'Inter', size:11 } }, grid:{ display:false } },
        y:{ ticks:{ font:{ family:'Inter', size:11 } }, grid:{ color:'#E3DDCF' } }
      }
    }
  });
}

/* ---------------- Auth gate ---------------- */
function showApp(user){
  currentUser = user;
  document.getElementById('auth-gate').classList.add('hidden');
  document.getElementById('app').style.display = 'flex';
  const info = document.getElementById('session-info');
  if(info) info.textContent = `${user.orgName} · ${user.email}`;
}
function showGate(){
  document.getElementById('auth-gate').classList.remove('hidden');
  document.getElementById('app').style.display = 'none';
}
function setAuthError(msg){
  const el = document.getElementById('auth-error');
  if(!el) return;
  if(msg){ el.textContent = msg; el.classList.add('visible'); }
  else { el.textContent = ''; el.classList.remove('visible'); }
}

document.querySelectorAll('.auth-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.auth-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.auth-form-panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab + '-form').classList.add('active');
    setAuthError(null);
  });
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  setAuthError(null);
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  try{
    const { user } = await apiPost('/api/auth/login', { email, password });
    showApp(user);
    await boot();
  }catch(err){ setAuthError(err.message || 'Sign in failed'); }
});

document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  setAuthError(null);
  const orgName = document.getElementById('register-org').value.trim();
  const name = document.getElementById('register-name').value.trim();
  const email = document.getElementById('register-email').value.trim();
  const password = document.getElementById('register-password').value;
  try{
    const { user } = await apiPost('/api/auth/register', { orgName, name, email, password });
    showApp(user);
    await boot();
  }catch(err){ setAuthError(err.message || 'Could not create account'); }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  try{ await apiPost('/api/auth/logout'); }catch(e){}
  location.reload();
});

/* ---------------- Boot: check session first, then load app data ---------------- */
async function initAuth(){
  try{
    const { user } = await apiGet('/api/auth/me');
    showApp(user);
    await boot();
  }catch(err){
    showGate();
  }
}
initAuth();
</script>
